name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_published:
        description: Verify the current published version and its release command without replacing files
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content CodexQuotaWidget.csproj
          $version = $project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Invalid project version' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match the project Version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Regression checks
        shell: pwsh
        run: |
          dotnet run --project tests/QuotaChecks/QuotaChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Regression checks failed' }
      - name: Build installer and portable ZIP
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Install, launch, reinstall and uninstall
        shell: powershell
        run: ./scripts/Test-Release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.verify_published
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download build artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name release-files --dir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Artifact download failed' }
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          VERIFY_PUBLISHED: ${{ inputs.verify_published }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          # Wrap the entire conditional so single arguments remain arrays during splatting.
          $releaseArgs = @(if ($version.Contains('-')) { '--prerelease'; '--latest=false' } else { '--latest' })
          if ($env:VERIFY_PUBLISHED -eq 'true') {
            $release = gh release view $tag --json isDraft,assets
            if ($LASTEXITCODE -ne 0 -or ($release | ConvertFrom-Json).isDraft) { throw 'Expected an existing public release' }
            gh release download $tag --dir verified-release
            if ($LASTEXITCODE -ne 0) { throw 'Published asset download failed' }
            $expectedNames = @("codex-quota-widget-v$version-windows-x64-setup.exe", "codex-quota-widget-v$version-windows-x64.zip")
            $lines = @(Get-Content verified-release/SHA256SUMS.txt)
            if ($lines.Count -ne 2) { throw 'Expected two checksums' }
            foreach ($line in $lines) {
              if ($line -notmatch '^([a-f0-9]{64})  ([^\\/]+)$') { throw 'Invalid checksum' }
              $hash = $Matches[1]; $name = $Matches[2]
              if ($name -notin $expectedNames) { throw 'Unexpected asset name' }
              if ((Get-FileHash -LiteralPath "verified-release/$name" -Algorithm SHA256).Hash -ine $hash) { throw 'Published checksum mismatch' }
              $expectedNames = @($expectedNames | Where-Object { $_ -ne $name })
            }
            if ($expectedNames.Count) { throw 'Missing release asset' }
            # Exercise the corrected publication command; preserve all public binary assets.
            gh release edit $tag --draft=false @releaseArgs
            if ($LASTEXITCODE -ne 0) { throw 'Publication command verification failed' }
            Write-Output 'Published files verified; publication command succeeded.'
            exit 0
          }
          $files = @("artifacts/codex-quota-widget-v$version-windows-x64-setup.exe", "artifacts/codex-quota-widget-v$version-windows-x64.zip", 'artifacts/SHA256SUMS.txt')
          $notes = "docs/releases/$tag.md"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Release is already public; publish a new version instead of replacing it.' }
          } else {
            $noteArgs = @(if (Test-Path -LiteralPath $notes) { '--notes-file'; $notes } else { '--generate-notes' })
            gh release create $tag --verify-tag --draft --title "Codex Quota Widget $tag" @noteArgs
            if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          }
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $tag --draft=false @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
